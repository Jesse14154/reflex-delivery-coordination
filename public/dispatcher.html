<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dispatcher Dashboard | Reflex</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <header class="main-header">

    <div class="logo">
      ⚡ REFLEX
    </div>


    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="retailer.html">
        Retailer
      </a>

      <a
        href="dispatcher.html"
        class="active"
      >
        Dispatcher
      </a>

      <a href="rider.html">
        Rider
      </a>

    </nav>

  </header>



  <main class="dashboard-page">


    <section class="dashboard-heading">

      <h1>
        📋 Dispatcher Dashboard
      </h1>

      <p>
        View open delivery requests and assign
        them to available riders.
      </p>

    </section>



    <section class="dashboard-card">


      <h2>
        Open Delivery Requests
      </h2>


      <div id="openDeliveries">

        <p>
          Loading open deliveries...
        </p>

      </div>


    </section>



    <section class="dashboard-card">


      <h2>
        All Deliveries
      </h2>


      <div id="allDeliveries">

        <p>
          Loading deliveries...
        </p>

      </div>


    </section>


  </main>



  <script src="dispatcher.js"></script>


</body>

</html>
