<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rider Dashboard | Reflex</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <header class="main-header">

    <div class="logo">
      ⚡ REFLEX
    </div>


    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="retailer.html">
        Retailer
      </a>

      <a href="dispatcher.html">
        Dispatcher
      </a>

      <a
        href="rider.html"
        class="active"
      >
        Rider
      </a>

    </nav>

  </header>



  <main class="dashboard-page">


    <section class="dashboard-heading">

      <h1>
        🛵 Rider Dashboard
      </h1>

      <p>
        View your assigned deliveries and update
        their progress.
      </p>

    </section>



    <section class="dashboard-card">


      <h2>
        Select Your Rider Profile
      </h2>


      <select id="riderFilter">

        <option value="">
          Select Rider
        </option>

      </select>


    </section>



    <section class="dashboard-card">


      <h2>
        My Assigned Deliveries
      </h2>


      <div id="riderDeliveries">

        <p>
          Select your rider profile to view
          deliveries.
        </p>

      </div>


    </section>


  </main>



  <script src="rider.js"></script>


</body>

</html>
