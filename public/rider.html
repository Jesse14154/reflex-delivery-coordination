<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Dashboard | Reflex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-role="rider">

  <header class="main-header">
    <div class="brand-block">
      <div class="logo"><span class="mark">⚡</span>REFLEX</div>
      <span class="motto-tag">Every Delivery. Every Move. In Sync.</span>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="retailer.html">Retailer</a>
      <a href="dispatcher.html">Dispatcher</a>
      <a href="rider.html" class="active">Rider</a>
    </nav>

    <div class="live-indicator">
      <span class="live-dot"></span>
      Live updates
    </div>
  </header>

  <main class="dashboard-page">

    <section class="dashboard-heading">
      <h1>🛵 Rider Dashboard</h1>
      <p>View your assigned deliveries and update their progress.</p>
    </section>

    <section class="dashboard-card">
      <h2>Select Your Rider Profile</h2>
      <select id="riderFilter">
        <option value="">Select Rider</option>
      </select>
    </section>

    <section class="dashboard-card">
      <h2>My Assigned Deliveries</h2>
      <div id="riderDeliveries">
        <p class="loading-note">Select your rider profile to view deliveries.</p>
      </div>
    </section>

  </main>

  <script src="realtime.js"></script>
  <script src="rider.js"></script>

</body>
</html>
