<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retailer Dashboard | Reflex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-role="retailer">

  <header class="main-header">
    <div class="brand-block">
      <div class="logo"><span class="mark">⚡</span>REFLEX</div>
      <span class="motto-tag">Every Delivery. Every Move. In Sync.</span>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="retailer.html" class="active">Retailer</a>
      <a href="dispatcher.html">Dispatcher</a>
      <a href="rider.html">Rider</a>
    </nav>

    <div class="live-indicator">
      <span class="live-dot"></span>
      Live updates
    </div>
  </header>

  <main class="dashboard-page">

    <section class="dashboard-heading">
      <h1>🏪 Retailer Dashboard</h1>
      <p>Create delivery requests and monitor their progress.</p>
    </section>

    <section class="dashboard-card">
      <h2>Create New Delivery</h2>

      <div id="formBanner" class="form-banner"></div>

      <form id="deliveryForm">

        <div>
          <label>Customer Name</label>
          <input type="text" id="customerName" placeholder="Enter customer name" required>
        </div>

        <div>
          <label>Customer Phone</label>
          <input type="text" id="customerPhone" placeholder="Enter customer phone number" required>
        </div>

        <div>
          <label>Delivery Address</label>
          <input type="text" id="deliveryAddress" placeholder="Enter delivery address" required>
        </div>

        <div>
          <label>Item Description</label>
          <textarea id="itemDescription" placeholder="Describe the item" required></textarea>
        </div>

        <button type="submit" id="submitDeliveryBtn">Create Delivery</button>

      </form>
    </section>

    <section class="dashboard-card">
      <h2>
        My Deliveries
        <span class="count-badge" id="retailerCount">0</span>
      </h2>

      <div class="list-toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="deliverySearch" placeholder="Search by customer name, phone, or delivery ID…">
        </div>
      </div>

      <div class="filter-chips" id="statusFilters">
        <button class="filter-chip active" data-filter="ALL">All</button>
        <button class="filter-chip" data-filter="OPEN">Open</button>
        <button class="filter-chip" data-filter="ASSIGNED">Assigned</button>
        <button class="filter-chip" data-filter="PICKED_UP">Picked up</button>
        <button class="filter-chip" data-filter="DELIVERED">Delivered</button>
      </div>

      <div id="retailerDeliveries">
        <p class="loading-note">Loading deliveries...</p>
      </div>
    </section>

  </main>

  <script src="realtime.js"></script>
  <script src="retailer.js"></script>

</body>
</html>
